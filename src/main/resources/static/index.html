<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Acme Payments · Settlement Console</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17344a;
      --ink-soft: #335268;
      --paper: #f1f5f6;
      --surface: #ffffff;
      --line: #d4dfe3;
      --muted: #687d89;
      --green: #176b51;
      --green-dark: #10533f;
      --green-wash: #e7f3ed;
      --brass: #c6a159;
      --red: #a43638;
      --red-wash: #fff0ef;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: #263d4b;
      font-size: 15px;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .topbar {
      border-bottom: 4px solid var(--brass);
      background: var(--ink);
      color: white;
    }

    .topbar-inner,
    .page-shell {
      width: min(1160px, calc(100% - 48px));
      margin: 0 auto;
    }

    .topbar-inner {
      display: flex;
      min-height: 78px;
      align-items: center;
      gap: 18px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: white;
      font-size: 20px;
      font-weight: 680;
      letter-spacing: -0.045em;
    }

    .brand-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(230, 208, 157, 0.85);
      border-radius: 3px;
      color: #e6d09d;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .topbar-divider {
      width: 1px;
      height: 27px;
      background: rgba(255, 255, 255, 0.28);
    }

    .topbar-subtitle {
      color: #dce6eb;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .page-shell {
      padding: 39px 0 64px;
    }

    .page-intro {
      margin-bottom: 25px;
    }

    .page-intro h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(25px, 3vw, 31px);
      font-weight: 620;
      letter-spacing: -0.045em;
      line-height: 1.2;
    }

    .page-intro p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.82fr);
      align-items: start;
      gap: 22px;
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
    }

    .settlement-panel {
      padding: 27px 29px 29px;
    }

    .panel-heading {
      margin: 0 0 22px;
      color: var(--ink);
      font-size: 20px;
      font-weight: 620;
      letter-spacing: -0.025em;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 17px 18px;
    }

    .field {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 7px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    .field label {
      color: #344f5e;
      font-size: 13px;
      font-weight: 590;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 43px;
      padding: 9px 11px;
      border: 1px solid #c7d4da;
      border-radius: 3px;
      outline: none;
      background: #fff;
      color: #203b4c;
    }

    .field input::placeholder {
      color: #8a9ba3;
    }

    .field input:focus,
    .field select:focus {
      border-color: #287a60;
      box-shadow: 0 0 0 3px rgba(40, 122, 96, 0.16);
    }

    .rate-strip {
      display: flex;
      min-height: 51px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 21px;
      padding: 11px 14px;
      border-left: 3px solid var(--brass);
      background: #f1f5f6;
    }

    .rate-label {
      color: #546b78;
      font-size: 13px;
      font-weight: 560;
    }

    .rate-value {
      color: var(--ink);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      font-weight: 630;
      text-align: right;
    }

    .is-error {
      color: var(--red) !important;
    }

    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .button {
      min-height: 43px;
      padding: 10px 17px;
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 620;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .button:focus-visible {
      outline: 3px solid rgba(198, 161, 89, 0.75);
      outline-offset: 2px;
    }

    .button-primary {
      background: var(--green);
      color: white;
    }

    .button-primary:hover:not(:disabled) {
      background: var(--green-dark);
    }

    .button-secondary {
      border-color: #8fa3ad;
      background: transparent;
      color: white;
    }

    .button-secondary:hover:not(:disabled) {
      border-color: white;
      background: rgba(255, 255, 255, 0.08);
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .feedback {
      margin-top: 19px;
      padding: 13px 15px;
      border: 1px solid transparent;
      border-radius: 3px;
      font-size: 14px;
    }

    .feedback[hidden] {
      display: none;
    }

    .feedback strong {
      display: block;
      font-weight: 650;
    }

    .feedback p {
      margin: 5px 0 0;
      overflow-wrap: anywhere;
    }

    .feedback-success {
      border-color: #b6d9c9;
      background: var(--green-wash);
      color: #185d46;
    }

    .feedback-error {
      border-color: #e6bbbb;
      background: var(--red-wash);
      color: var(--red);
    }

    .feedback-loading {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
      color: #dce6eb;
    }

    .balance-panel {
      padding: 25px 24px 23px;
      border: 0;
      border-top: 4px solid var(--brass);
      background: var(--ink);
      color: white;
    }

    .balance-panel .panel-heading {
      margin-bottom: 18px;
      color: white;
    }

    .balance-field label {
      color: #d2dfe5;
    }

    .balance-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .balance-result {
      margin-top: 23px;
    }

    .balance-values {
      display: grid;
      gap: 15px;
      margin: 0;
    }

    .balance-values div {
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.17);
    }

    .balance-values dt {
      margin-bottom: 3px;
      color: #c2d1d8;
      font-size: 12px;
    }

    .balance-values dd {
      margin: 0;
      color: #fff;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
      font-weight: 570;
      letter-spacing: -0.025em;
    }

    .balance-asof {
      margin: 15px 0 0;
      color: #c2d1d8;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .balance-panel .feedback-error {
      border-color: rgba(255, 202, 199, 0.42);
      background: rgba(164, 54, 56, 0.22);
      color: #ffd1ce;
    }

    .balance-panel .feedback-loading {
      padding: 12px 0 0;
      border: 0;
      background: transparent;
    }

    @media (max-width: 820px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      .balance-panel {
        max-width: none;
      }
    }

    @media (max-width: 560px) {
      .topbar-inner,
      .page-shell {
        width: min(100% - 32px, 1160px);
      }

      .topbar-inner {
        min-height: 70px;
        gap: 12px;
      }

      .wordmark {
        gap: 8px;
        font-size: 18px;
      }

      .topbar-subtitle {
        font-size: 13px;
      }

      .page-shell {
        padding-top: 29px;
      }

      .settlement-panel {
        padding: 22px 18px;
      }

      .balance-panel {
        padding: 22px 19px;
      }

      .field-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 15px;
      }

      .field-full {
        grid-column: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="wordmark"><span class="brand-mark" aria-hidden="true">A</span><span>Acme Bank</span></div>
      <span class="topbar-divider" aria-hidden="true"></span>
      <span class="topbar-subtitle">Payments Operations</span>
    </div>
  </header>

  <main class="page-shell">
    <div class="page-intro">
      <h1>Settlement operations</h1>
      <p>Create a settlement and review the account position.</p>
    </div>

    <div class="workspace">
      <section class="panel settlement-panel" aria-labelledby="settlement-heading">
        <h2 class="panel-heading" id="settlement-heading">New settlement</h2>
        <form id="settlement-form">
          <div class="field-grid">
            <div class="field field-full">
              <label for="reference">Reference</label>
              <input id="reference" name="reference" type="text" required>
            </div>
            <div class="field">
              <label for="debit-account">Debit account</label>
              <input id="debit-account" name="debitAccount" type="text" value="ACC-100234" required>
            </div>
            <div class="field">
              <label for="credit-account">Credit account</label>
              <input id="credit-account" name="creditAccount" type="text" value="ACC-200871" required>
            </div>
            <div class="field field-full">
              <label for="amount">Amount</label>
              <input id="amount" name="amount" type="number" min="0.01" step="0.01" value="1000.00" required>
            </div>
            <div class="field">
              <label for="source-currency">Source currency</label>
              <select id="source-currency" name="sourceCurrency">
                <option value="EUR" selected>EUR</option>
                <option value="USD">USD</option>
                <option value="CAD">CAD</option>
                <option value="GBP">GBP</option>
              </select>
            </div>
            <div class="field">
              <label for="settlement-currency">Settlement currency</label>
              <select id="settlement-currency" name="settlementCurrency">
                <option value="EUR">EUR</option>
                <option value="USD" selected>USD</option>
                <option value="CAD">CAD</option>
                <option value="GBP">GBP</option>
              </select>
            </div>
          </div>

          <div class="rate-strip">
            <span class="rate-label">Indicative rate</span>
            <span id="fx-rate" class="rate-value" aria-live="polite">Checking rate…</span>
          </div>

          <div class="form-actions">
            <button class="button button-primary" id="submit-settlement" type="submit">Submit settlement</button>
          </div>
          <div class="feedback" id="settlement-result" role="status" aria-live="polite" hidden></div>
        </form>
      </section>

      <section class="panel balance-panel" id="balance-panel" aria-labelledby="balance-heading">
        <h2 class="panel-heading" id="balance-heading">Account balance</h2>
        <div class="field balance-field">
          <label for="balance-account">Account ID</label>
          <input id="balance-account" name="balanceAccount" type="text" value="ACC-100234" required>
        </div>
        <div class="balance-actions">
          <button class="button button-secondary" id="refresh-balance" type="button">Refresh</button>
        </div>
        <div class="balance-result" id="balance-result" aria-live="polite" aria-busy="true"></div>
      </section>
    </div>
  </main>

  <script>
    const settlementForm = document.getElementById("settlement-form");
    const submitButton = document.getElementById("submit-settlement");
    const settlementResult = document.getElementById("settlement-result");
    const fxRate = document.getElementById("fx-rate");
    const sourceCurrency = document.getElementById("source-currency");
    const settlementCurrency = document.getElementById("settlement-currency");
    const balanceAccount = document.getElementById("balance-account");
    const balancePanel = document.getElementById("balance-panel");
    const balanceResult = document.getElementById("balance-result");
    const refreshBalanceButton = document.getElementById("refresh-balance");
    let rateRequest = 0;

    function createReference() {
      const now = new Date();
      const date = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("");
      const suffix = String(Math.floor(Math.random() * 10000)).padStart(4, "0");
      return `SET-${date}-${suffix}`;
    }

    async function readResponse(response) {
      const text = await response.text();
      if (!text) {
        return null;
      }
      try {
        return JSON.parse(text);
      } catch {
        return text;
      }
    }

    function responseMessage(payload, fallback) {
      if (payload && typeof payload === "object" && payload.message) {
        return String(payload.message);
      }
      if (typeof payload === "string" && payload.trim()) {
        return payload.trim();
      }
      if (payload && typeof payload === "object") {
        return JSON.stringify(payload);
      }
      return fallback;
    }

    function showFeedback(element, kind, heading, detail) {
      element.replaceChildren();
      element.className = `feedback feedback-${kind}`;
      element.hidden = false;
      const title = document.createElement("strong");
      title.textContent = heading;
      element.append(title);
      if (detail) {
        const message = document.createElement("p");
        message.textContent = detail;
        element.append(message);
      }
    }

    async function updateRate() {
      const request = ++rateRequest;
      const from = sourceCurrency.value;
      const to = settlementCurrency.value;
      fxRate.classList.remove("is-error");

      if (from === to) {
        fxRate.textContent = "No conversion";
        return;
      }

      fxRate.textContent = "Checking rate…";
      try {
        const response = await fetch(
          `/console/api/rates/${encodeURIComponent(from)}/${encodeURIComponent(to)}`
        );
        const payload = await readResponse(response);
        if (!response.ok) {
          throw new Error(responseMessage(payload, response.statusText || `HTTP ${response.status}`));
        }
        if (request !== rateRequest) {
          return;
        }
        const rate = Number(payload.rate);
        if (!Number.isFinite(rate)) {
          throw new Error("FX gateway returned an invalid rate");
        }
        const formattedRate = new Intl.NumberFormat(undefined, {
          minimumFractionDigits: 4,
          maximumFractionDigits: 4
        }).format(rate);
        fxRate.textContent = `1 ${from} = ${formattedRate} ${to}`;
      } catch (error) {
        if (request !== rateRequest) {
          return;
        }
        fxRate.textContent = `FX gateway unavailable: ${error.message || "Request failed"}`;
        fxRate.classList.add("is-error");
      }
    }

    function formatAmount(value) {
      const amount = Number(value);
      return Number.isFinite(amount)
        ? new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount)
        : String(value);
    }

    function showBalance(payload) {
      balanceResult.replaceChildren();
      balanceResult.className = "balance-result";
      balanceResult.setAttribute("aria-busy", "false");

      const values = document.createElement("dl");
      values.className = "balance-values";
      [
        ["Available balance", payload.availableBalance],
        ["Ledger balance", payload.ledgerBalance]
      ].forEach(([label, amount]) => {
        const row = document.createElement("div");
        const term = document.createElement("dt");
        term.textContent = label;
        const value = document.createElement("dd");
        value.textContent = `${formatAmount(amount)} ${payload.currency}`;
        row.append(term, value);
        values.append(row);
      });

      const asOf = document.createElement("p");
      asOf.className = "balance-asof";
      asOf.textContent = `As of ${payload.asOf} · Refreshed ${new Date().toLocaleTimeString("en-GB")}`;
      balanceResult.append(values, asOf);
    }

    async function loadBalance() {
      const accountId = balanceAccount.value.trim();
      if (!accountId) {
        balanceResult.setAttribute("aria-busy", "false");
        showFeedback(balanceResult, "error", "Balance unavailable: — Enter an account ID.");
        return;
      }

      refreshBalanceButton.disabled = true;
      balanceResult.className = "balance-result feedback feedback-loading";
      balanceResult.textContent = "Loading current balance…";
      balanceResult.setAttribute("aria-busy", "true");
      try {
        const response = await fetch(
          `/console/api/accounts/${encodeURIComponent(accountId)}/balance`
        );
        const payload = await readResponse(response);
        if (!response.ok) {
          const error = new Error(responseMessage(payload, response.statusText || "Request failed"));
          error.status = response.status;
          throw error;
        }
        showBalance(payload);
      } catch (error) {
        balanceResult.setAttribute("aria-busy", "false");
        showFeedback(
          balanceResult,
          "error",
          `Balance unavailable: ${error.status || "network"} ${error.message || "Request failed"}`
        );
      } finally {
        refreshBalanceButton.disabled = false;
      }
    }

    settlementForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      settlementResult.hidden = true;

      const form = new FormData(settlementForm);
      const request = {
        reference: form.get("reference"),
        debitAccount: form.get("debitAccount"),
        creditAccount: form.get("creditAccount"),
        amount: Number(form.get("amount")),
        sourceCurrency: form.get("sourceCurrency"),
        settlementCurrency: form.get("settlementCurrency")
      };

      try {
        const response = await fetch("/v1/settlements", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(request)
        });
        const payload = await readResponse(response);
        if (!response.ok) {
          showFeedback(
            settlementResult,
            "error",
            `Settlement failed · HTTP ${response.status}`,
            responseMessage(payload, response.statusText || "Request failed")
          );
          return;
        }
        showFeedback(
          settlementResult,
          "success",
          `Accepted · Ledger posting ${payload.postingId}`,
          `Posting ID: ${payload.postingId} · Status: ${payload.status}`
        );
        await loadBalance();
      } catch (error) {
        showFeedback(
          settlementResult,
          "error",
          "Settlement failed · Network unavailable",
          error.message || "Request failed"
        );
      } finally {
        submitButton.disabled = false;
      }
    });

    sourceCurrency.addEventListener("change", updateRate);
    settlementCurrency.addEventListener("change", updateRate);
    refreshBalanceButton.addEventListener("click", loadBalance);
    document.getElementById("reference").value = createReference();
    updateRate();
    loadBalance();
  </script>
</body>
</html>
